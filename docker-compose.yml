services:
  web:
    build: .
    image: chatquee-web:local
    ports:
      - "3000:3000"
    depends_on:
      analyzer:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - ANALYZER_SERVICE_URL=http://analyzer:8081
      - ANALYZER_TOKEN=${ANALYZER_TOKEN:-dev-token-please-change}
    restart: unless-stopped

  analyzer:
    build:
      context: ./services/go_sidecar
    image: chatquee-analyzer:local
    ports:
      - "8081:8081"
    environment:
      - ANALYZER_TOKEN=${ANALYZER_TOKEN:-dev-token-please-change}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/health" ]
      interval: 10s
      timeout: 3s
      retries: 3
